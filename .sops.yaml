# Rules are checked top to bottom and the first match wins.
keys:
  - &admin age18jx7h6hs4cgcdxu9pda5x0t6g6ee7y0egekdnts0as2c7uxdeelqsugx7k
  - &vm-nix age1nep8tx2m2dpezsl7nh3t4g2008d8gf42cq2665r0skc8r7c2092qldwzcu
  - &nixos-lxc age1lhs50pqy6qhnkvttq3ksl48rslj286w7fet2akt00zcxh7vcesrq60pl3x
  - &media-lxc age1vjrzhuuvzllck9u6wtnnhr7rtdrez6quuedylaqvz5psfcphggaqq4lx99
  - &nixos-ci age12m82lk8k3slk02fxwqkze27s62qra743870n4djhgn2v6yfra3hqcv3fvz
  - &proxmox age1c2k0c8paah0tgqcxtxn8gf98300eyyt84hwhquxvp3n2qtarcfxq4zvd8n
  - &macos age1cx7t4e9tkd6n3j60r9ek99c4v89lx389yp3nhsln9gawqn6yr4yqd8qvlg
  - &archlinux age1rryykhdtzeauum5vf29fvx2hpcsf73ug7v4n2zwn6z934avaqugqulyd2e
  - &linode age1hzqarxnqyhp69gxxddm7rpfqpkr2u2654t226z984ug3rappxenqze6dz0
creation_rules:
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin
          - *vm-nix
          - *nixos-lxc
          - *media-lxc
          - *nixos-ci
          - *proxmox
          - *macos
  - path_regex: secrets/hosts/vm-nix\.yaml$
    key_groups:
      - age:
          - *admin
          - *vm-nix
  - path_regex: secrets/hosts/nixos-lxc\.yaml$
    key_groups:
      - age:
          - *admin
          - *nixos-lxc
  - path_regex: secrets/hosts/media-lxc\.yaml$
    key_groups:
      - age:
          - *admin
          - *media-lxc
  - path_regex: secrets/hosts/wsl\.yaml$
    key_groups:
      - age:
          - *admin
  - path_regex: secrets/syncthing\.yaml$
    key_groups:
      - age:
          - *admin
          - *vm-nix
          - *proxmox
          - *macos
  - path_regex: secrets/(hermes\.env|hermes-dashboard\.yaml|restic-rclone\.conf)$
    key_groups:
      - age:
          - *admin
          - *vm-nix
  - path_regex: secrets/xray\.conf$
    key_groups:
      - age:
          - *admin
          - *vm-nix
          - *media-lxc
  - path_regex: secrets/lanraragi\.env$
    key_groups:
      - age:
          - *admin
          - *media-lxc
  - path_regex: secrets/email\.yaml$
    key_groups:
      - age:
          - *admin
          - *nixos-ci
          - *vm-nix
  - path_regex: secrets/mac_xray\.conf$
    key_groups:
      - age:
          - *admin
          - *macos
  - path_regex: secrets/public/[^/]+$
    key_groups:
      - age:
          - *admin
          - *archlinux
          - *linode
  - path_regex: secrets/
    key_groups:
      - age:
          - *admin
